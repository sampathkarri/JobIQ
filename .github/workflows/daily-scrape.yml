name: Daily Automated 2:00 AM Scraper & Deduplication

on:
  schedule:
    # 2:00 AM IST (Indian Standard Time, UTC+5:30) is 20:30 UTC every day
    - cron: '30 20 * * *'
  # Enables manual one-click execution from GitHub Actions dashboard
  workflow_dispatch:

jobs:
  run-daily-ingestion:
    name: Wake Render & Ingest Jobs
    runs-on: ubuntu-latest

    steps:
      - name: Ping Health Endpoint to Wake Up Render
        run: |
          echo "⏰ Sending heartbeat to Render to prevent/clear cold start..."
          # Render may sleep after 15m inactivity. Retry 3 times to allow 30-40s cold boot.
          curl -s --retry 3 --retry-delay 15 --max-time 60 "https://jobiq-3vun.onrender.com/api/v1/health" || true
          echo "Render is awake!"

      - name: Trigger Multi-Source Scraper Pipeline
        run: |
          echo "🚀 Triggering automated scraping from LinkedIn, Internshala, and Unstop..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://jobiq-3vun.onrender.com/api/v1/admin/scrape" \
            -H "Content-Type: application/json" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET || 'jobiq-cron-secret-key-2026' }}" \
            --max-time 180)
          
          echo "$RESPONSE"
          
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "❌ Scraping failed with HTTP status: $HTTP_STATUS"
            exit 1
          fi
          echo "✅ Scraper successfully fetched and saved opportunities!"

      - name: Trigger Deduplication Pipeline
        run: |
          echo "🧹 Running fuzzy SequenceMatcher deduplication..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://jobiq-3vun.onrender.com/api/v1/admin/deduplicate" \
            -H "Content-Type: application/json" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET || 'jobiq-cron-secret-key-2026' }}" \
            --max-time 60)
            
          echo "$RESPONSE"
          echo "✅ Deduplication completed!"
