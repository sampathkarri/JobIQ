<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Base Badge -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Inner Glow Ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="white" stroke-opacity="0.2" stroke-width="8" />

  <!-- Main 'J' Letterform combined with Briefcase handle -->
  <path d="M 280 140 H 360 V 310 C 360 375 315 410 240 410 C 175 410 135 370 135 320 H 200 C 200 340 215 355 240 355 C 270 355 290 335 290 300 V 200 H 280 Z" fill="#FFFFFF" />

  <!-- AI Four-Point Sparkle Star -->
  <path d="M 180 180 C 180 140 160 120 120 120 C 160 120 180 100 180 60 C 180 100 200 120 240 120 C 200 120 180 140 180 180 Z" fill="url(#sparkleGrad)" filter="url(#glow)" />
  <path d="M 370 120 C 370 95 355 80 330 80 C 355 80 370 65 370 40 C 370 65 385 80 410 80 C 385 80 370 95 370 120 Z" fill="#F472B6" />
</svg>
